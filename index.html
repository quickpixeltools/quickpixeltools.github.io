<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickPixel Tools - Free Image Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 20px 8%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        .tools {
            max-width: 900px;
            margin: 30px auto 80px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .tool-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .tool-card h2 {
            margin-top: 10px;
        }

        .tool-card p {
            color: #666;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            background: #111827;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: white;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">⚡ QuickPixel Tools</div>
    </header>

    <section class="hero">
        <h1>Free Online Image Tools</h1>
        <p>Compress and resize your images quickly and easily.</p>
    </section>

    <section class="tools">

        <div class="tool-card">
            <div style="font-size: 45px;">🗜️</div>
            <h2>Image Compressor</h2>
            <p>Reduce your image file size while keeping good quality.</p>
            <button>Open Tool</button>
        </div>

        <div class="tool-card">
            <div style="font-size: 45px;">📐</div>
            <h2>Image Resizer</h2>
            <p>Resize your images to the dimensions you need.</p>
            <button>Open Tool</button>
        </div>

    </section>

    <footer>
        © 2026 QuickPixel Tools — Free Online Tools
    </footer>

</body>
</html>
