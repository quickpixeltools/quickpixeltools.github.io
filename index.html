<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPixel Tools - Free Image Compressor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: white;
    padding: 20px 8%;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 60px 20px 30px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.hero p {
    color: #666;
    font-size: 18px;
}

.tool {
    max-width: 650px;
    margin: 30px auto 70px;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    text-align: center;
}

.upload {
    border: 2px dashed #aaa;
    padding: 35px 20px;
    border-radius: 12px;
    margin: 25px 0;
}

input[type="file"] {
    margin: 15px;
}

label {
    display: block;
    margin: 20px 0 8px;
    font-weight: bold;
}

input[type="range"] {
    width: 80%;
}

button {
    background: #111827;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 20px;
}

button:hover {
    opacity: 0.9;
}

#result {
    margin-top: 25px;
    font-weight: bold;
}

#download {
    display: none;
    text-decoration: none;
    background: #16a34a;
    color: white;
    padding: 12px 22px;
    border-radius: 8px;
    margin-top: 15px;
    display: inline-block;
}

footer {
    text-align: center;
    padding: 30px;
    background: white;
    color: #777;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ QuickPixel Tools</div>
</header>

<section class="hero">
    <h1>Free Image Compressor</h1>
    <p>Compress your images directly in your browser.</p>
</section>

<section class="tool">

    <div class="upload">
        <h2>Choose an Image</h2>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
        >
    </div>

    <label for="quality">
        Compression Quality: <span id="qualityValue">70</span>%
    </label>

    <input
        type="range"
        id="quality"
        min="10"
        max="100"
        value="70"
    >

    <br>

    <button onclick="compressImage()">
        Compress Image
    </button>

    <div id="result"></div>

    <a id="download" download="compressed-image.jpg">
        Download Compressed Image
    </a>

</section>

<footer>
    © 2026 QuickPixel Tools — Free Online Image Tools
</footer>

<script>

const qualitySlider = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

qualitySlider.addEventListener("input", function() {
    qualityValue.textContent = this.value;
});

function compressImage() {

    const input = document.getElementById("imageInput");

    if (!input.files || !input.files[0]) {
        alert("Please choose an image first.");
        return;
    }

    const file = input.files[0];

    const reader = new FileReader();

    reader.onload = function(event) {

        const image = new Image();

        image.onload = function() {

            const canvas = document.createElement("canvas");

            canvas.width = image.width;
            canvas.height = image.height;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const quality =
                parseInt(qualitySlider.value) / 100;

            canvas.toBlob(
                function(blob) {

                    const originalSize =
                        (file.size / 1024).toFixed(1);

                    const compressedSize =
                        (blob.size / 1024).toFixed(1);

                    const download =
                        document.getElementById("download");

                    const result =
                        document.getElementById("result");

                    const url =
                        URL.createObjectURL(blob);

                    download.href = url;
                    download.style.display = "inline-block";

                    result.innerHTML =
                        "Original: " +
                        originalSize +
                        " KB<br>" +
                        "Compressed: " +
                        compressedSize +
                        " KB";

                },
                "image/jpeg",
                quality
            );
        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

</script>

</body>
</html>
